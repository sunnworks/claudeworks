/* ---------------- 플레이어 ---------------- */
function startPlayer(cards, segments, mode) {
  stopTimer();
  S.player = { cards, segments, mode, i: 0, gi: 0, elapsed: 0, playing: true, rate: 1, broken: false, mountedKey: null, stall: 0 };
  startTimer();
}
let timer = null;
function startTimer() {
  stopTimer();
  timer = setInterval(() => {
    const p = S.player;
    if (!p || !p.playing) return;
    const dur = p.segments[p.i].ms / p.rate;
    const v = mountedVideo();
    if (v) {
      /* 영상이 아직 준비되지 않았으면 자막·진행바도 같이 기다린다 */
      const ready = v.readyState >= 3 && !v.paused && !v.seeking && v.currentTime > 0;
      if (!ready) {
        p.stall = (p.stall || 0) + 120;
        if (p.playing) v.play().catch(() => {});
        paintLoading();
        /* 이 기기에서 영상을 못 여는 경우 계속 기다리지 않고 그림 안내로 넘어간다 */
        if (p.stall >= 6000) { p.broken = true; render(); return; }
        if (p.stall < 4000) { paintProgress(); return; }
      } else {
        p.stall = 0;
        p.elapsed = (v.currentTime * 1000) / p.rate;
      }
    } else {
      p.elapsed += 120;
    }
    const cur = p.cards[p.i];
    p.gi = cur.gloss.length ? Math.min(cur.gloss.length - 1, Math.floor((p.elapsed / dur) * cur.gloss.length)) : 0;
    /* 영상 종료 이벤트가 오지 않는 경우를 대비한 안전망 */
    if (p.elapsed >= dur + (p.broken ? 0 : 2000)) nextSentence();
    else paintProgress();
  }, 120);
}
function paintLoading() {
  const box = document.getElementById('ptload');
  if (!box) return;
  const v = mountedVideo();
  const p = S.player;
  box.hidden = !(p && p.playing && v && (v.readyState < 3 || v.seeking));
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function paintProgress() {
  const p = S.player;
  if (!p) return;
  const bar = document.querySelector('.pt-bar i');
  const meta = document.querySelector('.pt-sub-meta span:first-child');
  if (!bar) return;
  const total = p.segments.reduce((a, b) => a + b.ms, 0) / p.rate;
  const before = p.segments.slice(0, p.i).reduce((a, b) => a + b.ms, 0) / p.rate;
  bar.style.width = `${Math.min(100, ((before + p.elapsed) / Math.max(1, total)) * 100)}%`;
  if (meta) meta.textContent = `${p.i + 1} / ${p.cards.length} 문장`;
  if (p.broken) {
    document.querySelectorAll('.gloss').forEach((el, i) => el.setAttribute('data-on', i === p.gi ? '1' : '0'));
  }
}
function nextSentence() {
  const p = S.player;
  if (p.i < p.cards.length - 1) { p.i += 1; p.elapsed = 0; p.gi = 0; render(); }
  else {
    p.playing = false;
    stopTimer();
    if (p.mode === 'patient') { S.patientPhase = 'DONE'; react('PLAY_COMPLETED'); }
    render();
  }
}

function react(type, q) {
  const s = S.session;
  if (!s || !s.approval) return;
  s.reactions.push({ id: nextId('REACTION'), type, q: q || null, at: now(), resolved: false });
  if (type === 'QUESTION') s.status = 'QUESTION';
  else if (type === 'PLAY_STARTED') s.status = 'PLAYING';
}

/* ---------------- QR 주소 ---------------- */
function shareUrl(token) {
  return `${location.origin}${location.pathname}#/r/${token}`;
}

/* ---------------- 라우팅 · 렌더 ---------------- */
function go(route) { S.route = route; S.error = null; S.modal = null; render(); }

function render() {
  const app = document.getElementById('app');
  const hash = location.hash || '';
  const shareMatch = /^#\/r\/(.+)$/.exec(hash);

  let html;
  if (shareMatch) html = viewShare(shareMatch[1]);
  else if (S.route === 'patient') html = viewPatient();
  else if (S.route === 'login') html = viewLogin();
  else if (S.route === 'dashboard') html = viewDashboard();
  else if (S.route === 'print') html = viewPrint();
  else if (S.route === 'gallery') html = viewGallery();
  else if (!S.session) html = viewLogin();
  else if (S.route === 'read') html = viewRead();
  else if (S.route === 'review') html = viewReview();
  else if (S.route === 'compose') html = viewCompose();
  else if (S.route === 'complete') html = viewComplete();
  else html = viewDashboard();

  /* 같은 화면 안에서 다시 그릴 때(체크·입력 등)는 보던 위치를 지키고,
     다른 화면으로 넘어갈 때만 맨 위에서 시작한다 */
  const routeKey = (S.session ? S.session.id : '-') + '/' + (shareMatch ? 'share' : S.route);
  routeChanged = routeKey !== lastRouteKey;
  lastRouteKey = routeKey;

  parkVideos();
  app.innerHTML = html;
  S.flash = null;
  if (routeChanged) scrollToTop();
  afterRender();
}

let lastRouteKey = null;
let routeChanged = false;

/** 화면을 넘길 때 맨 위로 되돌린다 (브라우저마다 스크롤 주체가 달라 모두 처리한다) */
function scrollToTop() {
  try { window.scrollTo({ top: 0, left: 0, behavior: 'auto' }); } catch (_) { window.scrollTo(0, 0); }
  const root = document.scrollingElement || document.documentElement;
  if (root) root.scrollTop = 0;
  if (document.body) document.body.scrollTop = 0;
  document.querySelectorAll('.patient.scroll, main.page').forEach((el) => { el.scrollTop = 0; });
}

function afterRender() {
  /* 새 화면으로 넘어왔으면 제목에 초점을 두어 키보드·화면낭독기가 처음부터 읽게 한다 */
  if (routeChanged) {
    routeChanged = false;
    const head = document.querySelector('.page-head h1, .pt-center h2, .patient h2');
    if (head) {
      head.setAttribute('tabindex', '-1');
      try { head.focus({ preventScroll: true }); } catch (_) {}
    }
  }

  /* 원문 강조: 필드에 포커스·호버하면 약봉투의 해당 영역을 강조한다 */
  document.querySelectorAll('.field[data-hl]').forEach((el) => {
    const raw = el.getAttribute('data-hl');
    if (!raw) return;
    const set = () => { try { S.highlight = JSON.parse(raw); renderHighlightOnly(); } catch (_) {} };
    el.addEventListener('mouseenter', set);
    el.addEventListener('focusin', set);
  });

  /* 영상 재생 상태 동기화 — 미리 받아 둔 요소를 그대로 옮겨 붙여 로딩을 없앤다 */
  const slot = document.getElementById('ptslot');
  const p0 = S.player;
  if (slot && p0 && !p0.broken) {
    const seg0 = p0.segments[p0.i];
    const v = videoFor(seg0.url);
    if (v.error) { p0.broken = true; render(); return; }
    slot.appendChild(v);
    v.playbackRate = p0.rate;
    if (p0.mountedKey !== p0.i + ':' + seg0.url) {
      p0.mountedKey = p0.i + ':' + seg0.url;
      try { v.currentTime = 0; } catch (_) {}
      p0.stall = 0;
    }
    paintLoading();
    v.onended = () => { if (S.player && S.player.playing) nextSentence(); };
    v.onerror = () => { if (S.player && !S.player.broken) { S.player.broken = true; render(); } };
    v.onwaiting = paintLoading;
    v.oncanplay = paintLoading;
    v.onplaying = paintLoading;
    if (p0.playing) v.play().catch(() => {}); else v.pause();
    /* 다음 문장 영상을 지금부터 준비해 둔다 */
    const nxt = p0.segments[p0.i + 1];
    if (nxt) { const nv = videoFor(nxt.url); try { nv.currentTime = 0; nv.load(); } catch (_) {} }
  }

  /* 검색창처럼 다시 그린 뒤 포커스를 되돌려야 하는 입력 */
  if (S.focusId) {
    const target = document.getElementById(S.focusId);
    S.focusId = null;
    if (target) {
      target.focus();
      const end = target.value.length;
      try { target.setSelectionRange(end, end); } catch (_) {}
    }
  }

  /* 카메라 스트림 복원 */
  const cam = document.getElementById('cam');
  if (cam && S.cameraStream) { cam.srcObject = S.cameraStream; cam.play().catch(() => {}); const h = document.getElementById('camhint'); if (h) h.hidden = true; }
}

function renderHighlightOnly() {
  const wrap = document.querySelector('.bagwrap');
  if (!wrap || !S.highlight) return;
  let hl = wrap.querySelector('.hl');
  if (!hl) { hl = document.createElement('div'); hl.className = 'hl'; wrap.appendChild(hl); }
  const h = S.highlight;
  hl.style.left = `${h.x * 100}%`; hl.style.top = `${h.y * 100}%`;
  hl.style.width = `${h.w * 100}%`; hl.style.height = `${h.h * 100}%`;
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  /* 안내창 바깥을 눌렀을 때만 닫는다 */
  if (act === 'modal-close' && el.classList.contains('modal-back') && e.target.closest('[data-stop]')) return;
  const s = S.session;

  switch (act) {
    case 'modal-close': S.modal = null; render(); break;
    case 'modal-focus': {
      const id = el.getAttribute('data-focus');
      S.modal = null;
      render();
      const target = document.getElementById(id);
      if (target) {
        const row = target.closest('.checkrow') || target;
        row.scrollIntoView({ block: 'center', behavior: 'smooth' });
        row.classList.add('pulse');
        setTimeout(() => row.classList.remove('pulse'), 2600);
        try { target.focus({ preventScroll: true }); } catch (_) { target.focus(); }
      }
      break;
    }
    case 'login': S.session = null; go('dashboard'); break;
    case 'route': {
      const r = el.getAttribute('data-route');
      if (location.hash) { history.replaceState(null, '', location.pathname); }
      go(r);
      break;
    }
    case 'new-session': startCase(S.caseId); break;
    case 'start-case': startCase(el.getAttribute('data-id')); break;
    case 'confirm-all': break;
    case 'to-play': {
      const sel0 = s ? selectedCards(s) : [];
      if (!sel0.length) {
        S.modal = {
          title: '보낼 문장이 없습니다',
          body: ['방문자에게 보여줄 문장이 하나도 체크되지 않았습니다.', '문장 목록에서 “포함하기”를 최소 1개 체크한 뒤 다시 눌러 주세요.'],
          focus: null,
        };
        render();
        break;
      }
      if (!S.confirmed) {
        S.modal = {
          title: '확인이 먼저 필요합니다',
          body: ['방문자에게 보내기 전에 약사님이 내용을 확인해 주셔야 합니다.', '오른쪽 “약봉투 내용과 위 문장을 확인했습니다”를 체크하면 수어영상 보기로 넘어갑니다.'],
          focus: 'confirm-all',
        };
        render();
        break;
      }
      S.approveChecks = { ocrMatchesBag: true, missingFieldsChecked: true, cautionsAppropriate: true, subtitlesChecked: true, finalApproval: true };
      approve();
      S.route = 'patient';
      S.patientPhase = 'READY';
      S.player = null;
      stopTimer();
      render();
      break;
    }
    case 'pt-finish': {
      stopTimer();
      S.player = null;
      if (!S.doneCases.includes(S.caseId)) S.doneCases = [...S.doneCases, S.caseId];
      S.route = 'complete';
      render();
      break;
    }
    case 'print': window.print(); break;

    case 'set-bag': S.activeBag = Number(el.getAttribute('data-i')); S.highlight = null; render(); break;

    case 'camera-on': startCamera(); break;
    case 'pick-photo': pickPhoto(); break;
    case 'mobile-shot': mobileShot(); break;
    case 'camera-off': stopCamera(); render(); break;
    case 'capture': capture(); break;

    case 'verify': verifyField(el.getAttribute('data-gid'), el.getAttribute('data-key')); render(); break;
    case 'patch': patchField(el.getAttribute('data-gid'), el.getAttribute('data-key'), el.getAttribute('data-value')); render(); break;
    case 'to-compose': s.status = 'COMPOSED'; s.cards = composeCards(s); S.confirmed = false; go('compose'); break;


    case 'move': {
      const dir = Number(el.getAttribute('data-dir'));
      const sorted = [...s.cards].sort((a, b) => a.order - b.order);
      const i = sorted.findIndex((x) => x.id === el.getAttribute('data-id'));
      const j = i + dir;
      if (i >= 0 && j >= 0 && j < sorted.length) {
        const a = sorted[i].order; sorted[i].order = sorted[j].order; sorted[j].order = a;
      }
      render();
      break;
    }
    case 'add-open': S.addOpen = true; S.addCat = null; S.addQuery = ''; render(); break;
    case 'add-close': S.addOpen = false; render(); break;
    case 'add-cat': {
      const cat = el.getAttribute('data-cat');
      S.addCat = cat === '' ? null : cat;
      render();
      break;
    }
    case 'add-lib': {
      const item = CAUTION_LIBRARY.find((x) => x.id === el.getAttribute('data-id'));
      if (item) {
        const ok = addGuidanceCard(item.text, item.gloss, 'REVIEWED_PHRASE_DB');
        S.flash = ok ? '안내 문장에 추가했습니다.' : '이미 추가된 문장입니다.';
      }
      render();
      break;
    }
    case 'add-custom': {
      const text = S.customText.trim();
      if (text === '' || S.generating !== null) break;
      /* 실제 서비스에서는 이 시점에 아바타가 문장에 맞는 수어영상을 생성한다 */
      S.generating = text;
      render();
      setTimeout(() => {
        const ok = addGuidanceCard(text, ['약사', '설명', '추가'], 'PHARMACIST_INPUT');
        S.generating = null;
        S.customText = ok ? '' : S.customText;
        S.flash = ok ? '수어영상을 만들어 안내 문장에 추가했습니다.' : '이미 추가된 문장입니다.';
        render();
      }, 1700);
      break;
    }

    case 'check': break; /* change 이벤트에서 처리 */
    case 'approve': approve(); render(); break;
    case 'revoke-approval': s.approval = null; s.avatar = null; s.status = 'COMPOSED'; S.confirmed = false; go('compose'); break;

    case 'show-patient': S.route = 'patient'; S.patientPhase = 'READY'; S.player = null; stopTimer(); render(); break;
    case 'hide-patient': stopTimer(); S.player = null; S.route = s.approval ? 'complete' : 'compose'; render(); break;

    case 'pt-start': {
      startPlayer(selectedCards(s), s.avatar.segments, 'patient');
      S.patientPhase = 'PLAYING';
      react('PLAY_STARTED');
      render();
      break;
    }
    case 'pt-toggle': S.player.playing = !S.player.playing; render(); break;
    case 'pt-restart': S.player.i = 0; S.player.elapsed = 0; S.player.gi = 0; S.player.playing = true; render(); break;
    case 'pt-prev': S.player.i = Math.max(0, S.player.i - 1); S.player.elapsed = 0; render(); break;
    case 'pt-next': S.player.i = Math.min(S.player.cards.length - 1, S.player.i + 1); S.player.elapsed = 0; render(); break;
    case 'pt-slow': {
      if (S.player) { S.player.rate = 0.7; S.player.playing = true; }
      if (s) { s.rate = 0.7; react('SLOW'); }
      if (S.patientPhase !== 'PLAYING' && s && s.avatar) { startPlayer(selectedCards(s), s.avatar.segments, 'patient'); S.player.rate = 0.7; S.patientPhase = 'PLAYING'; }
      render();
      break;
    }
    case 'pt-replay': startPlayer(selectedCards(s), s.avatar.segments, 'patient'); S.patientPhase = 'PLAYING'; react('REPLAY'); render(); break;
    case 'pt-understood': react('UNDERSTOOD'); S.route = 'complete'; stopTimer(); S.player = null; render(); break;

    case 'resend': {
      const r = s.reactions.find((x) => x.id === el.getAttribute('data-rid'));
      if (r) r.resolved = true;
      s.focusCardId = el.getAttribute('data-cid');
      s.status = 'PLAYING';
      S.flash = '그 문장을 방문자 화면에서 다시 보여줍니다.';
      render();
      break;
    }
    case 'complete': completeSession(); render(); break;
    case 'revoke-qr': revokeShare(s.shareToken); S.flash = 'QR을 사용 중지했습니다. 안내 내용도 지웠습니다.'; render(); break;
    case 'open-share': location.hash = `#/r/${s.shareToken}`; break;

  }
});

/* 타이핑 중에는 상태만 저장한다 (검색창은 결과를 바로 걸러야 하므로 다시 그린다) */
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'custom-input') {
    S.customText = el.value;
    const btn = document.querySelector('[data-act="add-custom"]');
    if (btn) btn.disabled = el.value.trim() === '' || S.generating !== null;
  } else if (act === 'search-input') {
    S.addQuery = el.value;
    const wrap = document.getElementById('liblistwrap');
    if (wrap) wrap.innerHTML = libraryList(S.session);
  }
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'patch-input') { patchField(el.getAttribute('data-gid'), el.getAttribute('data-key'), el.value); render(); }
  else if (act === 'confirm-all') { S.confirmed = el.checked; if (el.checked) S.modal = null; render(); }
  else if (act === 'toggle-card') {
    const card = S.session.cards.find((x) => x.id === el.getAttribute('data-id'));
    if (card) card.selected = el.checked;
    render();
  }
  else if (act === 'set-case') { S.captureCase = el.value; }
  else if (act === 'photo-input') { const f = el.files && el.files[0]; if (f) handlePhoto(f); el.value = ''; }
});

window.addEventListener('hashchange', () => { stopTimer(); S.player = null; render(); });

/* ---------------- 카메라 ---------------- */
/* getUserMedia는 https 또는 localhost에서만 동작하고, 일부 내장 화면에서는 차단된다 */
function cameraSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false;
}
async function startCamera() {
  if (!cameraSupported()) {
    S.error = '이 환경에서는 브라우저가 카메라 사용을 허용하지 않습니다. 아래 시연 케이스를 선택하거나 사진 불러오기를 사용해 주세요.';
    render();
    return;
  }
  try {
    S.cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 } }, audio: false });
    S.error = null;
  } catch (err) {
    const name = err && err.name;
    S.error = name === 'NotAllowedError'
      ? '카메라 권한이 차단되어 있습니다. 브라우저 주소창의 카메라 아이콘에서 허용하거나, 시연 케이스를 선택해 진행해 주세요.'
      : name === 'NotFoundError' || name === 'DevicesNotFoundError'
        ? '연결된 카메라를 찾을 수 없습니다. 시연 케이스를 선택하거나 사진 불러오기를 사용해 주세요.'
        : '카메라를 열 수 없습니다. 시연 케이스를 선택하거나 사진 불러오기를 사용해 주세요.';
  }
  render();
}

/* 사진 불러오기 — 카메라를 못 쓰는 환경의 대체 입력 */
function pickPhoto() {
  const input = document.getElementById('photofile');
  if (input) input.click();
}
/* 모바일·태블릿에서는 파일 입력의 capture 속성으로 카메라 앱을 연다 (iframe 권한과 무관) */
function mobileShot() {
  const input = document.getElementById('camfile');
  if (input) input.click();
}
/** 찍은 사진을 지금 보고 있는 약봉투 자리에 넣는다 */
function handlePhoto(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const s = S.session;
    if (s && s.bags.length) {
      const last = s.bags[s.bags.length - 1];
      last.img = String(reader.result);
      last.captured = true;
      S.flash = '찍은 사진을 약봉투 자리에 넣었습니다.';
      S.route = 'read';
      render();
    }
  };
  reader.readAsDataURL(file);
}
function stopCamera() {
  if (S.cameraStream) { S.cameraStream.getTracks().forEach((t) => t.stop()); S.cameraStream = null; }
}
function capture() {
  const video = document.getElementById('cam');
  if (!video || !S.cameraStream) {
    S.error = '먼저 카메라를 켜 주세요. 카메라를 쓸 수 없으면 사진 불러오기로 진행할 수 있습니다.';
    render();
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 960;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  stopCamera();
  const s = S.session;
  if (s && s.bags.length) {
    const last = s.bags[s.bags.length - 1];
    last.img = dataUrl;
    last.captured = true;
    S.flash = '촬영한 사진을 약봉투 자리에 넣었습니다.';
  }
  S.route = 'read';
  render();
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });

render();
preloadClips();
</script>
